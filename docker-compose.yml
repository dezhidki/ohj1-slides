services:
  slides:
    image: ghcr.io/dezhidki/ohj1-slides:latest
    container_name: ohj1-slides
    restart: unless-stopped
    ports:
      - "127.0.0.1:3040:80"       # nginx static slides
      - "127.0.0.1:3032:3032"     # poll WebSocket server
    environment:
      PRESENTER_TOKEN: ${PRESENTER_TOKEN:-changeme}
      POLL_SERVER_PORT: "3032"
