server {
    listen 80;
    server_name _;

    root /var/www/slides;

    # ── vote.html at root ──────────────────────────────────────────────────
    location = /vote.html {
        try_files /vote.html =404;
    }

    # ── Per-lecture slides ─────────────────────────────────────────────────
    # Rewrite /luento1/N → /luento1/#N for Slidev hash routing
    location ~* ^/(luento\d+)/(\d+)$ {
        return 301 /$1/#$2;
    }

    # Serve each lecture's dist folder with SPA fallback
    location ~* ^/(luento\d+)(/.*)? {
        try_files $uri $uri/ /$1/index.html;
    }

    # Root → redirect to luento1 (sensible default)
    location = / {
        return 302 /luento1/;
    }
}
